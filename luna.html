<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.4.0/model-viewer.min.js"></script>
    
    <style>
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; font-family: sans-serif; }
        
        model-viewer { 
            width: 100%; 
            height: 100%; 
            background-color: transparent;
            touch-action: pan-y;
            cursor: pointer;
            outline: none;
        }

        /* Style for the Expand Button */
        #fullscreen-btn {
            position: absolute;
            bottom: 20px;
            right: 20px; /* Positioned bottom-right */
            z-index: 100;
            
            width: 40px;
            height: 40px;
            background-color: rgba(255, 255, 255, 0.8);
            border-radius: 50%;
            border: none;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 2px 5px rgba(0,0,0,0.3);
        }
        
        /* Icon styling */
        svg { width: 24px; height: 24px; fill: #333; }
    </style>
</head>
<body>

    <div id="container" style="position: relative; width: 100%; height: 100%;">
        
        <model-viewer 
            id="interactive-model"
            src="https://static.wixstatic.com/3d/74d54c_9c5ad020bbca4e8190c062ecf0e1855d.glb" 
            alt="A 3D model" 
            
            minimum-render-scale="1"
            shadow-intensity="1"
            
            disable-zoom
            disable-pan
            min-camera-orbit="auto 90deg auto"
            max-camera-orbit="auto 90deg auto"
            
            auto-rotate 
            rotation-per-second="60deg/s"
            
            onclick="toggleControls()"
        >
        </model-viewer>

        <button id="fullscreen-btn" onclick="toggleFullscreen()">
            <svg viewBox="0 0 24 24"><path d="M7 14H5v5h5v-2H7v-3zm-2-4h2V7h3V5H5v5zm12 7h-3v2h5v-5h-2v3zM14 5v2h3v3h2V5h-5z"/></svg>
        </button>
    </div>

    <script>
        // 1. Interaction Toggle (Tap model to spin)
        function toggleControls() {
            const model = document.getElementById("interactive-model");
            if (model.hasAttribute("camera-controls")) {
                model.removeAttribute("camera-controls");
                model.setAttribute("auto-rotate", ""); 
            } else {
                model.setAttribute("camera-controls", "");
                model.removeAttribute("auto-rotate"); 
            }
        }

        // 2. Fullscreen Toggle (Click button to expand)
        function toggleFullscreen() {
            const elem = document.getElementById("container");
            
            if (!document.fullscreenElement) {
                // Try to enter fullscreen
                if (elem.requestFullscreen) { elem.requestFullscreen(); }
                else if (elem.webkitRequestFullscreen) { elem.webkitRequestFullscreen(); } /* Safari */
                else if (elem.msRequestFullscreen) { elem.msRequestFullscreen(); } /* IE11 */
            } else {
                // Exit fullscreen
                if (document.exitFullscreen) { document.exitFullscreen(); }
            }
        }
    </script>

</body>
</html>
